<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1300" viewBox="0 0 1600 1300" role="img" aria-labelledby="title description">
  <title id="title">Wireframes de escritorio principales de Nova</title>
  <desc id="description">Inicio administrativo, composición de una venta y seguimiento de deuda en escritorio.</desc>
  <style>
    .title{font:800 34px Arial,sans-serif;fill:#1f2937}.sub{font:400 16px Arial,sans-serif;fill:#64748b}.label{font:700 12px Arial,sans-serif;fill:#64748b;letter-spacing:1px}.h1{font:800 24px Arial,sans-serif;fill:#1f2937}.h2{font:700 16px Arial,sans-serif;fill:#1f2937}.body{font:400 13px Arial,sans-serif;fill:#475569}.small{font:400 11px Arial,sans-serif;fill:#64748b}.strong{font:700 13px Arial,sans-serif;fill:#1f2937}.money{font:800 21px Arial,sans-serif;fill:#1f2937}.white{fill:#fff}.blue{fill:#2563eb}.mint{fill:#2bae8c}.amber{fill:#f3b43f}.soft{fill:#f6f8fc}.blueSoft{fill:#eaf0ff}.mintSoft{fill:#e8f8f2}.amberSoft{fill:#fff4d8}.panel{fill:#fff;stroke:#dbe2eb}.line{stroke:#dbe2eb}.nav{font:600 13px Arial,sans-serif;fill:#475569}.navOn{font:800 13px Arial,sans-serif;fill:#2563eb}
  </style>
  <rect width="1600" height="1300" fill="#f6f8fc"/>
  <text x="62" y="60" class="label">NOVA · WIREFRAMES RESPONSIVE</text><text x="62" y="103" class="title">Escritorio: más contexto, el mismo lenguaje</text><text x="62" y="134" class="sub">Baja fidelidad · jerarquía, densidad y continuidad con móvil</text>

  <!-- Admin dashboard -->
  <g transform="translate(62 180)">
    <text x="0" y="-16" class="label">01 · INICIO ADMINISTRADOR</text>
    <rect width="1476" height="430" rx="22" class="panel"/>
    <rect width="220" height="430" rx="22" fill="#fff"/><line x1="220" y1="0" x2="220" y2="430" class="line"/>
    <rect x="24" y="24" width="38" height="38" rx="10" class="blue"/><text x="43" y="49" text-anchor="middle" font-family="Arial" font-size="18" font-weight="800" class="white">N</text><text x="76" y="49" class="h2">Nova</text>
    <text x="24" y="96" class="navOn">Inicio</text><text x="24" y="128" class="nav">Ventas</text><text x="24" y="160" class="nav">Inventario</text><text x="24" y="192" class="nav">Clientes</text>
    <text x="24" y="236" class="label">GESTIÓN</text><text x="24" y="268" class="nav">Catálogo</text><text x="24" y="300" class="nav">Compras y anticipos</text><text x="24" y="332" class="nav">Gastos</text><text x="24" y="364" class="nav">Reportes</text><text x="24" y="402" class="small">Ana · Administradora</text>
    <g transform="translate(256 30)">
      <text x="0" y="24" class="small">Miércoles, 21 de octubre</text><text x="0" y="58" class="h1">Resumen del negocio</text><text x="960" y="48" class="small blue">Cómo funciona</text><rect x="1028" y="16" width="152" height="46" rx="12" class="blue"/><text x="1104" y="45" text-anchor="middle" class="strong white">＋ Nueva venta</text>
      <text x="0" y="103" class="h2">Por resolver</text>
      <rect x="0" y="118" width="244" height="92" rx="14" class="amberSoft"/><text x="18" y="145" class="small">DEUDAS VENCIDAS</text><text x="18" y="181" class="money">3</text><text x="215" y="181" text-anchor="end" class="small">Ver ventas →</text>
      <rect x="262" y="118" width="244" height="92" rx="14" class="mintSoft"/><text x="280" y="145" class="small">PRODUCTOS EN REVISIÓN</text><text x="280" y="181" class="money">2</text><text x="477" y="181" text-anchor="end" class="small">Resolver →</text>
      <rect x="524" y="118" width="244" height="92" rx="14" class="blueSoft"/><text x="542" y="145" class="small">ENTREGAS PENDIENTES</text><text x="542" y="181" class="money">4</text><text x="739" y="181" text-anchor="end" class="small">Ver ventas →</text>
      <text x="0" y="252" class="h2">Octubre</text>
      <rect x="0" y="267" width="768" height="100" rx="14" class="soft"/><text x="18" y="295" class="small">VENTAS CONFIRMADAS</text><text x="18" y="330" class="money">S/ 8 420</text><text x="284" y="295" class="small">MARGEN DEL MES</text><text x="284" y="330" class="money">S/ 2 180</text><text x="550" y="295" class="small">GASTOS OPERATIVOS</text><text x="550" y="330" class="money">S/ 740</text><text x="742" y="350" text-anchor="end" class="small blue">Abrir reportes →</text>
      <rect x="792" y="118" width="388" height="249" rx="14" class="panel"/><text x="812" y="148" class="h2">Actividad reciente</text><line x1="812" y1="164" x2="1158" y2="164" class="line"/><circle cx="820" cy="190" r="5" class="mint"/><text x="838" y="194" class="strong">Pago S/ 50 · V-1042</text><text x="1158" y="194" text-anchor="end" class="small">Ana · 10:42</text><circle cx="820" cy="230" r="5" class="blue"/><text x="838" y="234" class="strong">Venta V-1043 confirmada</text><text x="1158" y="234" text-anchor="end" class="small">Luis · 10:18</text><circle cx="820" cy="270" r="5" class="amber"/><text x="838" y="274" class="strong">Ajuste de stock MUN-001</text><text x="1158" y="274" text-anchor="end" class="small">Ana · 09:55</text><text x="812" y="340" class="small blue">Ver toda la actividad →</text>
    </g>
  </g>

  <!-- Sale desk -->
  <g transform="translate(62 685)">
    <text x="0" y="-16" class="label">02 · NUEVA VENTA · MESA DE TRABAJO</text>
    <rect width="930" height="535" rx="22" class="panel"/>
    <rect width="176" height="535" rx="22" fill="#fff"/><line x1="176" y1="0" x2="176" y2="535" class="line"/>
    <text x="24" y="48" class="h2">Nova</text><text x="24" y="92" class="nav">Inicio</text><text x="24" y="124" class="navOn">Ventas</text><text x="24" y="156" class="nav">Inventario</text><text x="24" y="188" class="nav">Clientes</text>
    <g transform="translate(206 28)">
      <text x="0" y="28" class="small">Ventas / Nueva venta</text><text x="0" y="64" class="h1">Nueva venta</text><text x="678" y="56" text-anchor="end" class="small blue">Cómo funciona</text>
      <rect x="0" y="84" width="452" height="42" rx="11" class="soft" stroke="#cbd5e1"/><text x="18" y="110" class="body">⌕ Buscar producto por código o nombre</text>
      <text x="0" y="161" class="h2">Productos</text>
      <rect x="0" y="176" width="452" height="126" rx="14" class="panel"/><text x="16" y="202" class="small">MUN-001 · TIENDA</text><text x="16" y="226" class="strong">Muñeca clásica</text><text x="16" y="252" class="body">Cantidad 2 · S/ 25.00 c/u</text><text x="432" y="252" text-anchor="end" class="strong">S/ 50.00</text><text x="16" y="282" class="small mint">Entrega 1</text><text x="104" y="282" class="small amber">Reserva 1</text><text x="432" y="282" text-anchor="end" class="small blue">Editar</text>
      <text x="0" y="338" class="h2">Cliente y acuerdo</text><rect x="0" y="350" width="452" height="44" rx="11" class="soft"/><text x="16" y="377" class="body">Rosa Medina · 987 654 321</text><text x="0" y="425" class="small">Pago inicial: S/ 20.00 · Yape</text><text x="0" y="450" class="small amber">Vencimiento: 30 oct. · Quedará saldo</text>
      <g transform="translate(480 84)">
        <rect width="198" height="366" rx="16" class="blueSoft"/><text x="18" y="30" class="label">RESUMEN</text><text x="18" y="68" class="small">Productos</text><text x="180" y="68" text-anchor="end" class="strong">S/ 50.00</text><text x="18" y="96" class="small">Pago inicial</text><text x="180" y="96" text-anchor="end" class="strong mint">S/ 20.00</text><line x1="18" y1="116" x2="180" y2="116" class="line"/><text x="18" y="150" class="h2">Saldo</text><text x="180" y="150" text-anchor="end" class="money">S/ 30.00</text><text x="18" y="190" class="small">Se lleva ahora</text><text x="180" y="190" text-anchor="end" class="strong">1 unidad</text><text x="18" y="216" class="small">Queda separada</text><text x="180" y="216" text-anchor="end" class="strong">1 unidad</text><rect x="18" y="270" width="162" height="44" rx="11" class="blue"/><text x="99" y="297" text-anchor="middle" class="strong white">Revisar venta</text><text x="99" y="338" text-anchor="middle" class="small">Guardar borrador</text>
      </g>
    </g>
  </g>

  <!-- Debt desk -->
  <g transform="translate(1022 685)">
    <text x="0" y="-16" class="label">03 · CUENTA DEL CLIENTE</text>
    <rect width="516" height="535" rx="22" class="panel"/>
    <g transform="translate(28 30)">
      <text x="0" y="18" class="small">Clientes / Rosa Medina</text><text x="0" y="54" class="h1">Rosa Medina</text><text x="0" y="78" class="body">987 654 321</text><text x="458" y="52" text-anchor="end" class="small blue">Cómo funciona</text>
      <rect x="0" y="100" width="460" height="92" rx="14" class="amberSoft"/><text x="18" y="128" class="small">SALDO PENDIENTE</text><text x="18" y="166" class="money">S/ 50.00</text><text x="442" y="132" text-anchor="end" class="strong">1 venta atrasada</text><rect x="292" y="148" width="150" height="34" rx="10" class="blue"/><text x="367" y="170" text-anchor="middle" class="strong white">Registrar pago</text>
      <text x="0" y="230" class="h2">Venta V-1038</text><text x="458" y="230" text-anchor="end" class="small blue">Acciones administrativas ▾</text>
      <rect x="0" y="246" width="460" height="84" rx="12" class="soft"/><text x="16" y="272" class="small">TOTAL VIGENTE</text><text x="16" y="306" class="money">S/ 100.00</text><text x="186" y="272" class="small">PAGADO</text><text x="186" y="306" class="money mint">S/ 50.00</text><text x="338" y="272" class="small">SALDO</text><text x="338" y="306" class="money">S/ 50.00</text>
      <text x="0" y="366" class="h2">Rastro de la operación</text><line x1="11" y1="388" x2="11" y2="465" class="line"/><circle cx="11" cy="394" r="6" class="mint"/><text x="28" y="398" class="strong">Pago de S/ 50.00 registrado</text><text x="28" y="417" class="small">10 oct., 18:42 · Ana · Yape</text><circle cx="11" cy="450" r="6" class="blue"/><text x="28" y="454" class="strong">Venta confirmada</text><text x="28" y="473" class="small">8 oct., 16:20 · Luis</text>
    </g>
  </g>
  <text x="62" y="1266" class="small">Los valores son datos sintéticos para probar jerarquía; no representan operaciones reales.</text>
</svg>
