<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title description">
  <title id="title">Paleta de colores propuesta para Nova</title>
  <desc id="description">Una paleta clara con blanco nube, blanco puro, azul tinta, azul Nova, menta, ámbar y rojo de alerta.</desc>
